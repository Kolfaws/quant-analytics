[project]
name = "quant-analytics"
version = "0.1.0"
description = "Read-only Streamlit dashboard for Quant backtests, baselines and factor research."
authors = [
    { name = "Kalofaws" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "loguru>=0.7.3",
    "numpy>=2.5.4",
    "plotly>=6.5.0",
    "polars>=2.1.0",
    "pre-commit>=4.7.0",
    "pyarrow>=26.0.1",
    "pytz>=2026.6",
    "streamlit>=1.50.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quant_analytics"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
extraPaths = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
