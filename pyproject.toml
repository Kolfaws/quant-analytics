[project]
name = "quant-analytics"
version = "0.1.0"
description = "Read-only Streamlit dashboard for Quant backtests, baselines and factor research."
authors = [
    { name = "Kalofaws" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "loguru>=0.7.3",
    "numpy>=2.5.4",
    "plotly>=6.5.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pytz>=2026.6",
    "streamlit>=1.50.0",
]

# 这是一个应用，不构建/发布 wheel：uv 只同步依赖，不安装自己
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
